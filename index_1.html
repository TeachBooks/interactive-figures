<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <title>Interactive SVG Framework</title>
</head>

<body>
    <div id="app"></div>
    <!-- Right side - Controls -->
    <div class="controls-container">
        <!-- Statistics Section -->
        <div class="stats-section">
            <h3>Statistics</h3>
            <div class="stat-item">
                <span class="stat-label">RMSE:</span>
                <span class="stat-value" id="RMSEValue">0.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Std Dev X1:</span>
                <span class="stat-value" id="stdX1Value">1.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Std Dev X2:</span>
                <span class="stat-value" id="stdX2Value">1.00</span>
            </div>
        </div>

        <!-- Sliders -->
        <button type="button" id="startTraining">Start training</button>
        <div class="slider-group">
            <div class="slider-label">Layer 1 Neurons</div>
            <input id="meanX1" class="slider" type="range" min="1" max="20" step="1" value="20">
            <div class="range-values">
                <span>1</span>
                <span>20</span>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">Layer 2 Neurons</div>
            <input id="meanX2" class="slider" type="range" min="1" max="20" step="1" value="20">
            <div class="range-values">
                <span>1</span>
                <span>20</span>
            </div>
        </div>
        <script type="module" src="./src/main.js"></script>
</body>

</html>
