<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
  <title>Interactive SVG Framework</title>
</head>
<body>
  <div id="app"></div>
        <!-- Right side - Controls -->
    <div class="controls-container">
        <!-- Statistics Section -->
        <div class="stats-section">
            <h3>Statistics</h3>
            <div class="stat-item">
                <span class="stat-label">RMSE:</span>
                <span class="stat-value" id="RMSEValue">0.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Std Dev X1:</span>
                <span class="stat-value" id="stdX1Value">1.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Std Dev X2:</span>
                <span class="stat-value" id="stdX2Value">1.00</span>
            </div>
        </div>

        <!-- Sliders -->
         <input type="file" id="csvFile" accept=".csv">
        <div class="slider-group">
            <div class="slider-label">Slider</div>
            <input id="meanX1" class="slider" type="range" min="0.000001" max="0.999999" step="0.01" value="0">
            <div class="range-values">
                <span>0</span>
                <span>1</span>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">var1</div>
            <input id="var1" class="slider" type="range" min="0.1" max="3" step="0.1" value="3">
            <div class="range-values">
                <span>0.1</span>
                <span>3</span>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">var2</div>
            <input id="var2" class="slider" type="range" min="0.1" max="3" step="0.1" value="1">
            <div class="range-values">
                <span>0.1</span>
                <span>2</span>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-label">covariance</div>
            <input id="stdX2" class="slider" type="range" min="-1" max="1" step="0.1" value="0.5">
            <div class="range-values">
                <span>-1</span>
                <span>1</span>
            </div>
        </div>
  <script type="module" src="./src/main4.js"></script>
</body>
</html>
