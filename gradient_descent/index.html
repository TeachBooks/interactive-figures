<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polynomial Regression with Gradient Descent</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Light-colored box for the graph -->
        <div class="graph-container">
            <div id="dataPlot"></div>
        </div>

        <div class="controls-container">
            <h2>Controls</h2>

            <div class="slider-group">
                <div class="slider-label">Learning Rate</div>
                <input type="range" id="learningRate" min="0.01" max="0.1" step="0.01" value="0.05">
                <div class="range-values">
                    <span>0.01</span>
                    <span>0.1</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">Iterations</div>
                <input type="range" id="iterations" min="10" max="500" step="10" value="100">
                <div class="range-values">
                    <span>10</span>
                    <span>500</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">Polynomial Degree</div>
                <input type="range" id="degree" min="1" max="5" step="1" value="2">
                <div class="range-values">
                    <span>1</span>
                    <span>5</span>
                </div>
            </div>

            <button id="startButton">Start Training</button>
            <p id="statusMessage"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
