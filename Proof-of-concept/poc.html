<!DOCTYPE html>
<html>

<head>
   <script src="https://unpkg.com/mathjs/lib/browser/math.js"></script>
   <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script> -->
   <script src="https://d3js.org/d3.v7.min.js"></script>

   <script type="text/javascript" src="./interactive-figures.js"></script>

   <!-- <script type="text/javascript" src="./math.js"></script>

   <script type="text/javascript" src="./d3.v7.min.js"></script> -->


   <style>
      body {
         font-family: Arial, sans-serif;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         margin: 0;
         overflow: hidden;
      }

      #my_datavisualization {
         width: 80vw;
         height: 80vh;
         display: flex;
         align-items: center;
         justify-content: space-around;
      }

      .slider-container {
         display: flex;
         flex-direction: column;
         align-items: center;
         margin-top: 10px;
      }

      .slider {
         margin: 5px;
      }

      .slider-label {
         font-size: 12px;
         margin: 2px;
      }
   </style>
</head>

</div>

<body>
   <!-- Main div for visualization -->
   <div id="my_datavisualization"></div>

   <div id="density_contours" style="width: 300px; height: 300px;"></div>
   <div id="samples_plot" style="width: 300px; height: 300px;"></div>

   <div class="slider-container">
      <!-- Mean sliders -->
      <div class="slider-label">Mean of X1</div>
      <input id="meanX1" class="slider" type="range" min="-2" max="2" step="0.1" value="0">
      <div class="slider-label">Mean of X2</div>
      <input id="meanX2" class="slider" type="range" min="-2" max="2" step="0.1" value="0">

      <!-- Standard deviation sliders -->
      <div class="slider-label">Standard deviation of X1</div>
      <input id="stdX1" class="slider" type="range" min="0.1" max="2" step="0.1" value="1">
      <div class="slider-label">Standard deviation of X2</div>
      <input id="stdX2" class="slider" type="range" min="0.1" max="2" step="0.1" value="1">

      <!-- Correlation slider -->
      <div class="slider-label">Correlation</div>
      <input id="correlation" class="slider" type="range" min="-1" max="1" step="0.01" value="0">
   </div>

   <script>
      // SVG dimensions
      const width = 300;
      const height = 300;
      const margin = { top: 20, right: 20, bottom: 20, left: 20 };

      // Initial parameters for Gaussian distribution
      let params = {
         meanX1: 0,
         meanX2: 0,
         stdX1: 1,
         stdX2: 1,
         correlation: 0
      };

      // Create SVG containers
      const densitySVG = d3.select("#density_contours")
         .append("svg")
         .attr("width", width)
         .attr("height", height);

      const samplesSVG = d3.select("#samples_plot")
         .append("svg")
         .attr("width", width)
         .attr("height", height);

      // First read and add the image
      const my_svg = new MudeSCI("https://raw.githubusercontent.com/TeachBooks/interactive-figures/refs/heads/main/Images/usable_example.svg");
      my_svg.image.then(data => {
         d3.select("#my_datavisualization").node().append(data.documentElement); // append the svg to the div element
         updatePlot();
      });

      // Function to generate Gaussian data points
      function generateGaussianPoints(meanX1, meanX2, stdX1, stdX2, correlation, numPoints = 100) {
         const points = [];
         for (let i = 0; i < numPoints; i++) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            const z1 = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
            const x1 = meanX1 + stdX1 * z0;
            const x2 = meanX2 + stdX2 * (correlation * z0 + Math.sqrt(1 - correlation ** 2) * z1);
            points.push({ x1, x2 });
         }
         return points;
      }

      // Function to update the plot based on slider values
      function updatePlot() {
         const points = generateGaussianPoints(
            params.meanX1, params.meanX2, params.stdX1, params.stdX2, params.correlation
         );

         // Select the imported SVG and clear previous points
         d3.select("#samples_plot svg").selectAll("circle").remove();

         // Update scales to match your SVG axis range
         const xScale = d3.scaleLinear().domain([-10, 10]).range([margin.left, width - margin.right]);
         const yScale = d3.scaleLinear().domain([-5, 5]).range([height - margin.bottom, margin.top]);

         // Overlay new points onto the SVG
         d3.select("#samples_plot svg")
            .selectAll("circle")
            .data(points)
            .enter()
            .append("circle")
            .attr("cx", d => xScale(d.x1))
            .attr("cy", d => yScale(d.x2))
            .attr("r", 3)
            .attr("fill", "blue");
      }


      // Initial plot rendering
      updatePlot();

      // Slider event listeners to update parameters and plot
      d3.select("#meanX1").on("input", function () {
         params.meanX1 = +this.value;
         updatePlot();
      });
      d3.select("#meanX2").on("input", function () {
         params.meanX2 = +this.value;
         updatePlot();
      });
      d3.select("#stdX1").on("input", function () {
         params.stdX1 = +this.value;
         updatePlot();
      });
      d3.select("#stdX2").on("input", function () {
         params.stdX2 = +this.value;
         updatePlot();
      });
      d3.select("#correlation").on("input", function () {
         params.correlation = +this.value;
         updatePlot();
      });
   </script>
</body>

</html>
