<!DOCTYPE html>
<html>
<head>
   <script src="https://d3js.org/d3.v7.min.js"></script>

   <style>
      body {
         font-family: Arial, sans-serif;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         margin: 0;
         overflow: hidden;
      }

      #my_datavisualization {
         width: 80vw;
         height: 80vh;
         display: flex;
         align-items: center;
         justify-content: space-around;
      }

      .slider-container {
         display: flex;
         flex-direction: column;
         align-items: center;
         margin-top: 10px;
         width: 200px; /* Fixed width for the container */
      }

      .slider-group {
         width: 100%;
         margin: 10px 0;
      }

      .slider {
         margin: 5px;
         width: 100%;
      }

      .slider-label {
         font-size: 12px;
         margin: 2px;
      }

      .range-values {
         display: flex;
         justify-content: space-between;
         width: 100%;
         font-size: 12px;
         color: #666;
         margin-top: 2px;
      }
   </style>
</head>

<body>
   <div id="my_datavisualization"></div>

   <div class="slider-container">
       <div class="slider-group">
           <div class="slider-label">Mean of X1</div>
           <label for="meanX1"></label><input id="meanX1" class="slider" type="range" min="-2" max="2" step="0.1" value="0">
           <div class="range-values">
               <span>-2</span>
               <span>2</span>
           </div>
       </div>

       <div class="slider-group">
           <div class="slider-label">Mean of X2</div>
           <label for="meanX2"></label><input id="meanX2" class="slider" type="range" min="-2" max="2" step="0.1" value="0">
           <div class="range-values">
               <span>-2</span>
               <span>2</span>
           </div>
       </div>

       <div class="slider-group">
           <div class="slider-label">Standard deviation of X1</div>
           <label for="stdX1"></label><input id="stdX1" class="slider" type="range" min="0.1" max="2" step="0.1" value="1">
           <div class="range-values">
               <span>0.1</span>
               <span>2</span>
           </div>
       </div>

       <div class="slider-group">
           <div class="slider-label">Standard deviation of X2</div>
           <label for="stdX2"></label><input id="stdX2" class="slider" type="range" min="0.1" max="2" step="0.1" value="1">
           <div class="range-values">
               <span>0.1</span>
               <span>2</span>
           </div>
       </div>

       <div class="slider-group">
           <div class="slider-label">Correlation</div>
           <label for="correlation"></label><input id="correlation" class="slider" type="range" min="-1" max="1" step="0.01" value="0">
           <div class="range-values">
               <span>-1</span>
               <span>1</span>
           </div>
       </div>
   </div>


   <script>
      // Initial parameters for Gaussian distribution
      let params = {
         meanX1: 0,
         meanX2: 0,
         stdX1: 1,
         stdX2: 1,
         correlation: 0
      };

      // Load the SVG with two xy graphs directly with D3
      d3.xml("https://raw.githubusercontent.com/TeachBooks/interactive-figures/refs/heads/main/Images/usable_example.svg").then(data => {
         const importedSVG = data.documentElement;
         d3.select("#my_datavisualization").node().appendChild(importedSVG);

         // Create a D3 selection for the inner group (g) element within the SVG
         const svgGroup = d3.select(importedSVG).select("g");

         // Create text elements for displaying mean and standard deviations
         const meanDisplay = svgGroup.append("text")
           .attr("id", "meanDisplay")
           .attr("x", 86.6)
           .attr("y", 131.6)
           .style("font-size", "2.11667px")
           .style("fill", "black");

         const sigma1Display = svgGroup.append("text")
           .attr("id", "sigma1Display")
           .attr("x", 90)
           .attr("y", 135.5)
           .style("font-size", "2.11667px")
           .style("fill", "black");

         const sigma2Display = svgGroup.append("text")
           .attr("id", "sigma2Display")
           .attr("x", 90)
           .attr("y", 139.5)
           .style("font-size", "2.11667px")
           .style("fill", "black");



         // Set the scales based on initial bounding box
         const bbox = svgGroup.node().getBBox();
         const xScale = d3.scaleLinear().domain([-10, 10]).range([bbox.x, bbox.x + bbox.width]);
         const yScale = d3.scaleLinear().domain([-5, 5]).range([bbox.y + bbox.height, bbox.y]);

         // Initial plot rendering
         updatePlot(svgGroup, xScale, yScale);

         // Slider event listeners to update parameters and plot
         d3.select("#meanX1").on("input", function() {
            params.meanX1 = +this.value;
            updatePlot(svgGroup, xScale, yScale);
         });
         d3.select("#meanX2").on("input", function() {
            params.meanX2 = +this.value;
            updatePlot(svgGroup, xScale, yScale);
         });
         d3.select("#stdX1").on("input", function() {
            params.stdX1 = +this.value;
            updatePlot(svgGroup, xScale, yScale);
         });
         d3.select("#stdX2").on("input", function() {
            params.stdX2 = +this.value;
            updatePlot(svgGroup, xScale, yScale);
         });
         d3.select("#correlation").on("input", function() {
            params.correlation = +this.value;
            updatePlot(svgGroup, xScale, yScale);
         });
      });

       function updateMatrixValues(svgGroup) {
            // Update the text elements for the matrix
        d3.select(svgGroup).select("#text2048").text("01"); // Change value of loc-00
        d3.select(svgGroup).select("#text2052").text("12"); // Change value of loc-11
        d3.select(svgGroup).select("#text2056").text("21"); // Change value of loc-01
        d3.select(svgGroup).select("#text2060").text("10"); // Change value of loc-10
       }

      // Function to update the plot based on slider values
      // Function to update the plot based on slider values
      function updatePlot(svgGroup, xScale, yScale) {
        const points = generateGaussianPoints(
          params.meanX1, params.meanX2, params.stdX1, params.stdX2, params.correlation
        );

        // Clear previous points
        svgGroup.selectAll("circle").remove();

        // Append new points onto the SVG with the axis
        svgGroup
          .selectAll("circle")
          .data(points)
          .enter()
          .append("circle")
          .attr("cx", d => xScale(d.x1))
          .attr("cy", d => yScale(d.x2))
          .attr("r", 0.5)
          .attr("fill", "blue");

        // Calculate statistics and update display
        const stats = calculateStatistics(points);

        // Debug log to check values
        console.log("Stats:", stats);
        console.log("Params:", params);

        updateTextContent(stats);
      }


      function calculateStatistics(points) {
          const meanX1 = d3.mean(points, d => d.x1);
          const meanX2 = d3.mean(points, d => d.x2);
          const stdX1 = Math.sqrt(d3.variance(points, d => d.x1));
          const stdX2 = Math.sqrt(d3.variance(points, d => d.x2));
          // Make sure we return the correlation parameter from the global params
          return { meanX1, meanX2, stdX1, stdX2, correlation: params.correlation };
      }


      function updateTextContent(stats) {
           console.log("Updating text content with stats:", stats);

          // Update means display
          d3.select("#meanDisplay")
            .text(`${stats.meanX1.toFixed(2)}, ${stats.meanX2.toFixed(2)}`);

          // Update standard deviation display
          d3.select("#sigma1Display")
            .text(`${stats.stdX1.toFixed(2)}`);
          d3.select("#sigma2Display")
            .text(`${stats.stdX2.toFixed(2)}`);

          // Calculate covariance matrix elements based on current stats
          const sigmaX1Sq = Math.pow(stats.stdX1, 2);
          const sigmaX2Sq = Math.pow(stats.stdX2, 2);
          const covX1X2 = stats.correlation * stats.stdX1 * stats.stdX2;

          console.log("Matrix values:", {
            sigmaX1Sq,
            sigmaX2Sq,
            covX1X2,
            correlation: stats.correlation,
            stdX1: stats.stdX1,
            stdX2: stats.stdX2
        });

          // Update covariance matrix values in the SVG
          d3.select("#text2048").text(sigmaX1Sq.toFixed(2));   // loc-00: σ(X1)^2
          d3.select("#text2052").text(sigmaX2Sq.toFixed(2));   // loc-11: σ(X2)^2
          d3.select("#text2056").text(covX1X2.toFixed(2));     // loc-01: ρ * σ(X1) * σ(X2)
          d3.select("#text2060").text(covX1X2.toFixed(2));     // loc-10: ρ * σ(X1) * σ(X2)
      }


      // Function to generate Gaussian data points
      function generateGaussianPoints(meanX1, meanX2, stdX1, stdX2, correlation, numPoints = 100) {
         const points = [];
         for (let i = 0; i < numPoints; i++) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            const z1 = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);
            const x1 = meanX1 + stdX1 * z0;
            const x2 = meanX2 + stdX2 * (correlation * z0 + Math.sqrt(1 - correlation ** 2) * z1);
            points.push({ x1, x2 });
         }
         return points;
      }

      // Slider event listeners to update parameters and plot
      d3.select("#meanX1").on("input", function () {
          params.meanX1 = +this.value;
          d3.select("#meanX1Value").text(this.value); // Update displayed value
          updatePlotAndRescale();
      });
      d3.select("#meanX2").on("input", function () {
          params.meanX2 = +this.value;
          d3.select("#meanX2Value").text(this.value); // Update displayed value
          updatePlotAndRescale();
      });
      d3.select("#stdX1").on("input", function () {
          params.stdX1 = +this.value;
          d3.select("#stdX1Value").text(this.value); // Update displayed value
          updatePlotAndRescale();
      });
      d3.select("#stdX2").on("input", function () {
          params.stdX2 = +this.value;
          d3.select("#stdX2Value").text(this.value); // Update displayed value
          updatePlotAndRescale();
      });
      d3.select("#correlation").on("input", function () {
          params.correlation = +this.value;
          d3.select("#correlationValue").text(this.value); // Update displayed value
          updatePlotAndRescale();
      });


      function updatePlotAndRescale() {
         const svgGroup = d3.select("#my_datavisualization svg g");
         const bbox = svgGroup.node().getBBox();
         const xScale = d3.scaleLinear().domain([-10, 10]).range([bbox.x, bbox.x + bbox.width]);
         const yScale = d3.scaleLinear().domain([-5, 5]).range([bbox.y + bbox.height, bbox.y]);
         updatePlot(svgGroup, xScale, yScale);
      }
   </script>
</body>
