      function gaussianRandom(mean = 0, stdev = 0.1) {
         const u = 1 - Math.random(); // Converting [0,1) to (0,1]
         const v = Math.random();
         const z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
         // 
         return z * stdev + mean;
         // return 
      }

      // TODO!: I need to create a function that will linearly map the x and y values to the x and y axis
      // Current problem with the code, it assumes straight lines, e.g. x_axis has height of 0, y_axis has width of 0
      function x_axis_limit(x_orig, x_sample) {
         // I get x + width, convert to location of x axis
         x0 = x_orig.x
         x1 = x0 + x_orig.width

         middle_point = x_orig.width / 2

         // map x_sample to values between x0 and x1
         x = x0 + x_sample * (x1 - x0)

         return x + middle_point;
      }
      function y_axis_limit(y_orig, y_sample) {
         // I get x + width, convert to location of x axis
         y0 = y_orig.y
         y1 = y0 + y_orig.height

         middle_point = y_orig.height / 2

         // map x_sample to values between x0 and x1
         y = y0 + y_sample * (y1 - y0)

         return y + middle_point;
      }
      function linspace(start, end, resolution) {
             var spacing = [];
             // Go through a for-loop
             var i;
             for (i = 0; i < resolution; i++) {
                 spacing.push(start + (end - start) * i / (resolution - 1))
             }
             return spacing; // The function returns the linspace between p1 and p2
         }
      function standard_Gaussian_pdf(mean = 0, std = 0.5) {
         var x = linspace(-3, 3, 201);
         // Create a dummy variable
         var result = [];
         normalize = math.dotDivide(
            1,
            math.sqrt(
               math.dotMultiply(
                  math.dotMultiply(
                     2,
                     math.PI),
                  math.pow(
                     std,
                     2))));

         var i;
         for (i = 0; i < x.length; i++) {
            // Evaluate the first element of the Gaussian mixture
            expon = math.exp(
               -math.dotDivide(
                  math.pow(
                     x[i] - mean,
                     2),
                  math.dotMultiply(
                     2,
                     math.pow(
                        std,
                        2))))
            temp = math.dotMultiply(
               normalize,
               expon)
            result.push(-temp+0.19) //quick and dirty offset
         }
         return result
      }
